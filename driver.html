<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com wss://*.firebaseio.com; frame-src https://*.firebaseapp.com; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060918"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Driver App">
<link rel="manifest" href="driver-manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Driver App</title>
<style>
:root{--bg:#060918;--card:#101531;--line:#232a52;--txt:#eef1ff;--mut:#8f98c8;--acc:#4f8cff;--ok:#2ecc8f;--bad:#ff6b7a;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#f2f4fb;--card:#fff;--line:#dde2f2;--txt:#12172f;--mut:#5d668f;color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-text-size-adjust:100%;overscroll-behavior:none}
.wrap{max-width:460px;margin:0 auto;padding:20px 18px 40px;min-height:100%;display:flex;flex-direction:column}
.hide{display:none!important}
.brand{display:flex;align-items:center;gap:12px;margin:18px 0 26px}
.brand img{width:44px;height:44px;border-radius:11px}
.brand b{font-size:18px;display:block}.brand span{font-size:13px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
input{width:100%;font:inherit;font-size:16px;color:var(--txt);background:transparent;border:1px solid var(--line);border-radius:12px;padding:13px 14px;outline:none}
input:focus{border-color:var(--acc)}
.pw{position:relative}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mut);font-size:13px;padding:10px}
.btn{width:100%;margin-top:20px;background:var(--acc);color:#fff;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6}.btn.g{background:transparent;color:var(--mut);border:1px solid var(--line);margin-top:12px}
.err{color:var(--bad);font-size:14px;margin-top:14px;min-height:20px}
.hero{text-align:center;padding:26px 20px}
.ph{width:132px;height:132px;border-radius:50%;object-fit:cover;border:3px solid var(--line);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;color:var(--mut);background:var(--bg)}
.hero h2{margin:0;font-size:22px}.hero p{margin:4px 0 0;color:var(--mut);font-size:14px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);margin-top:12px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--bad)}.live.on i{background:var(--ok)}
.rows{margin-top:14px}.row{display:flex;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row span{color:var(--mut);font-size:14px}.row b{font-weight:600;text-align:right;word-break:break-word}
.note{font-size:13px;color:var(--mut);text-align:center;margin-top:18px}
#inst{margin-top:14px}
.spin{margin:auto;width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style></head><body>
<div class="wrap">
 <div id="boot" class="spin"></div>

 <div id="login" class="hide">
  <div class="brand"><img src="icon-192.png" alt=""><div><b>Driver App</b><span>Sign in to see your details</span></div></div>
  <div class="card">
   <label for="u">Username</label><input id="u" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
   <label for="p">Password</label><div class="pw"><input id="p" type="password" autocomplete="current-password"><button type="button" id="sh">Show</button></div>
   <div class="err" id="e"></div>
   <button class="btn" id="go">Sign in</button>
  </div>
  <div class="note">Your username and password are given by the office.</div>
  <div id="inst" class="card hide" style="font-size:14px"></div>
 </div>

 <div id="home" class="hide">
  <div class="brand"><img src="icon-192.png" alt=""><div><b>Driver App</b><span>My details</span></div></div>
  <div class="card hero"><div id="ph" class="ph"></div><h2 id="nm"></h2><p id="sub"></p><div class="live" id="lv"><i></i><span>Connecting…</span></div></div>
  <div class="card rows" style="margin-top:14px" id="rows"></div>
  <button class="btn g" id="out">Sign out</button>
 </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const FB={apiKey:"AIzaSyDjIdRU9ZheXDQYmE-8onjE3Vow_cX7t44",authDomain:"saifnavastransportation.firebaseapp.com",projectId:"saifnavastransportation",storageBucket:"saifnavastransportation.firebasestorage.app",messagingSenderId:"858865289383",appId:"1:858865289383:web:750474764d16a68ec7f382"};
const DOMAIN='driver.saifnavas.app';           // username -> username@DOMAIN (must match the logins the owner creates)
const HIDDEN=['username','name','phone','photo','updated','basic','allow','salary','wps','pays','leaves','pt','pi','pe','pxo']; // never shown as extra rows
firebase.initializeApp(FB);
const auth=firebase.auth(),db=firebase.firestore(),$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let unsub=null;
const show=id=>['boot','login','home'].forEach(x=>$('#'+x).classList.toggle('hide',x!==id));

auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
auth.onAuthStateChanged(u=>{
  if(unsub){unsub();unsub=null}
  if(!u){show('login');return}
  show('home');live(false,'Connecting…');
  unsub=db.collection('driverapp').doc(u.uid).onSnapshot(s=>{
    if(!s.exists){render(null);live(true,'Signed in · no profile published yet');return}
    render(s.data());live(!s.metadata.fromCache,s.metadata.fromCache?'Offline · showing saved copy':'Live');
  },e=>{live(false,e.code=='permission-denied'?'Not allowed to read this profile':'Connection problem')});
});
function live(on,t){const l=$('#lv');l.classList.toggle('on',on);l.querySelector('span').textContent=t}
function render(d){
  if(!d){$('#nm').textContent='Welcome';$('#sub').textContent='';$('#ph').textContent='?';$('#rows').innerHTML='<div class="row"><span>Your profile has not been published by the office yet.</span></div>';return}
  const nm=d.name||'Driver';$('#nm').textContent=nm;$('#sub').textContent=d.phone||'';
  const ph=$('#ph');
  if(d.photo){ph.innerHTML='';ph.style.background='url("'+String(d.photo).replace(/"/g,'')+'") center/cover'}else{ph.style.background='';ph.textContent=nm.trim().charAt(0).toUpperCase()}
  const rows=[['Name',nm],['Phone',d.phone]];
  const extra=d.details&&typeof d.details=='object'?d.details:d;
  Object.keys(extra).forEach(k=>{if(extra===d&&HIDDEN.indexOf(k)>=0)return;if(extra===d.details&&HIDDEN.indexOf(k.toLowerCase())>=0)return;const v=extra[k];if(v==null||typeof v=='object'||v==='')return;rows.push([k.replace(/_/g,' ').replace(/^./,c=>c.toUpperCase()),v])});
  $('#rows').innerHTML=rows.filter(r=>r[1]).map(r=>'<div class="row"><span>'+esc(r[0])+'</span><b>'+esc(r[1])+'</b></div>').join('');
}
async function login(){
  const u=$('#u').value.trim().toLowerCase().replace(/\s+/g,''),p=$('#p').value;$('#e').textContent='';
  if(!u||!p){$('#e').textContent='Enter your username and password.';return}
  $('#go').disabled=true;$('#go').textContent='Signing in…';
  try{await auth.signInWithEmailAndPassword(u+'@'+DOMAIN,p);$('#p').value=''}
  catch(e){const c=e.code||'';$('#e').textContent=/network/.test(c)?'No internet connection.':/too-many/.test(c)?'Too many attempts. Try again later.':'Wrong username or password.'}
  $('#go').disabled=false;$('#go').textContent='Sign in';
}
$('#go').onclick=login;$('#p').onkeydown=e=>{if(e.key=='Enter')login()};
$('#sh').onclick=()=>{const p=$('#p'),h=p.type=='password';p.type=h?'text':'password';$('#sh').textContent=h?'Hide':'Show'};
$('#out').onclick=()=>auth.signOut();
// install help (Android prompt / iOS instructions)
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
let dip=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;if(!standalone){const b=$('#inst');b.classList.remove('hide');b.innerHTML='<b>Install this app</b><br><span style="color:var(--mut)">Add it to your home screen for quick access.</span><button class="btn" id="ib" style="margin-top:12px">Install</button>';$('#ib').onclick=async()=>{dip.prompt();await dip.userChoice;dip=null;b.classList.add('hide')}}});
if(!standalone&&/iphone|ipad|ipod/i.test(navigator.userAgent)){const b=$('#inst');b.classList.remove('hide');b.innerHTML='<b>Install on iPhone</b><br><span style="color:var(--mut)">Tap the Share button in Safari, then “Add to Home Screen”.</span>'}
</script></body></html>
