let DEPQ=[],DF={},KM=null,ST=null,IV='',CF2='all';let U=null,CD=false,CV=true,TB=[],ME={},D=null,SCHD=[],SCHA=[],LK=null,UNS=[],TAB='trips',DV='today',TODAY=ymd(new Date()),SEL=TODAY,CM=new Date(new Date().getFullYear(),new Date().getMonth(),1),FE=null,FT='One Way',DN=null;
const show=id=>['boot','login','home'].forEach(x=>$('#'+x).classList.toggle('hide',x!==id));
const EMP=(t,s)=>'<div class="emp"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg><b>'+t+'</b>'+(s?'<div>'+s+'</div>':'')+'</div>';
const ICON={info:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.1"/></svg>',trips:'<svg viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h6a4 4 0 0 0 0-8h-4a4 4 0 0 1 0-8h6"/></svg>',cash:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg>',appr:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>',sched:'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>'};

auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
auth.onAuthStateChanged(async u=>{
  UNS.forEach(f=>{try{f()}catch(e){}});UNS=[];$('#dlg').classList.add('hide');
  if(!u){U=null;D=null;SCHD=[];SCHA=[];LK=null;DEPQ=[];DF={};KM=null;$('#prof').classList.add('hide');show('login');return}
  U=u;show('boot');ME={};CD=false;CV=true;
  try{const s=await db.collection('users').doc(u.uid).get();if(s.exists)ME=s.data()}catch(e){ME={_err:e.code||'error'}}
  if(ME.role=='dispatcher'){
    if(!ME.disabled){CD=true;CV=!!ME.drv}
    else if(!ME.drv){await auth.signOut();alert('This dispatcher access is switched off. Contact the office.');return}
  }
  TB=[];if(CD)TB.push(['sched','Schedule']);if(CV)TB.push(['trips','Trips'],['cash','Cash'],['appr','Approvals'],['info','Info']);TAB=TB[0][0];
  buildNav();show('home');live(false,'Connecting…');paint();
  const err=e=>live(false,e.code=='permission-denied'?'Not allowed to read this data':'Connection problem');
  if(CV){
    UNS.push(db.collection('driverapp').doc(u.uid).onSnapshot(s=>{D=s.exists?s.data():null;paint();live(!s.metadata.fromCache,s.exists?(s.metadata.fromCache?'Offline · saved copy':'Live'):(CD?'Live':'No profile published yet'))},err));
    UNS.push(db.collection('advreq').where('uid','==',u.uid).onSnapshot(s=>{ADQ=s.docs.map(x=>Object.assign({id:x.id},x.data())).sort((a,b)=>(b.at||0)-(a.at||0));paint()},()=>{}));
    UNS.push(db.collection('depreq').where('uid','==',u.uid).onSnapshot(s=>{DEPQ=s.docs.map(x=>Object.assign({id:x.id},x.data())).sort((a,b)=>(b.at||0)-(a.at||0));paint()},()=>{}));
    UNS.push(db.collection('schedule').where('uid','==',u.uid).onSnapshot(s=>{SCHD=s.docs.map(x=>Object.assign({id:x.id},x.data()));paint()},err));
    UNS.push(db.collection('kmlog').doc(u.uid).onSnapshot(s=>{KM=s.exists?s.data():null;paint()},()=>{}));
  }
  if(CD){
    const since=ymd(new Date(Date.now()-60*864e5));
    UNS.push(db.collection('schedule').where('date','>=',since).onSnapshot(s=>{SCHA=s.docs.map(x=>Object.assign({id:x.id},x.data()));live(!s.metadata.fromCache,s.metadata.fromCache?'Offline · saved copy':'Live');paint()},err));
    UNS.push(db.collection('lookup').doc('dispatch').onSnapshot(s=>{LK=s.exists?s.data():{}},()=>{}));
  }
  if(!window._iv)window._iv=setInterval(()=>{if(U){const n=ymd(new Date());if(n!=TODAY){if(SEL==TODAY)SEL=n;TODAY=n}paint(true)}},60000);
});
function buildNav(){$('#nav').innerHTML=TB.map(t=>'<button data-t="'+t[0]+'">'+ICON[t[0]]+t[1]+'<span class="bd hide" id="b_'+t[0]+'"></span></button>').join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;paint();scrollTo(0,0)})}
function live(on,t){const l=$('#lv');l.className='pill '+(on?'g':'w');l.textContent=t;$('.av').classList.toggle('on',on)}

/* ---------- vehicle KM (one meter reading per vehicle per day) ---------- */
const vk=v=>String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const kmKey=(d,v)=>d+'_'+vk(v);
const kmDay=(d,v)=>((KM&&KM.days)||{})[kmKey(d,v)]||null;
function kmPrev(v,before){let best=null;const k=vk(v),days=(KM&&KM.days)||{};Object.keys(days).forEach(key=>{const e=days[key]||{},d=key.slice(0,10);if(vk(e.veh)!==k||d>=before)return;if(!best||d>best.d||(d==best.d&&e.km>best.km))best={d:d,km:+e.km}});return best}
async function saveKm(v,km){const at=Date.now(),days={};days[kmKey(TODAY,v)]={veh:v,km:km,at:at};
  await db.collection('kmlog').doc(U.uid).set({uid:U.uid,driver:(D&&D.name)||ME.name||'',last:{veh:v,km:km,date:TODAY,at:at},days:days,_ts:at},{merge:true})}

/* ---------- trip cards ---------- */
const chipsStat=L=>{const n=f=>L.filter(f).length;return '<div class="chips2"><span class="pill b">'+n(s=>s.status=='started')+' on trip</span><span class="pill r">'+n(isNew)+' not started</span><span class="pill g">'+n(s=>s.status=='completed'||s.status=='posted')+' completed</span></div>'};
function sc(s,who){
  const st=stat(s);
  let h='<div class="trip'+(s.status=='started'?' on':'')+'"><div class="tt"><div class="tm">'+(s.time?esc(s.time):'—')+'<small>'+fsh(s.date)+'</small></div><span class="pill '+st.c+'">'+esc(st.t)+'</span></div>';
  h+='<div class="cu"><b>'+esc(s.customer||'Trip')+'</b>'+(s.company&&s.company!='PERSONAL'?'<div class="sub">'+esc(s.company)+'</div>':'')+(who?'<div class="sub">Driver: '+esc(s.driver||'')+'</div>':'')+'</div>';
  h+='<div class="rte"><div class="rl"><i class="d1"></i><i class="d2"></i></div><div class="rn"><div>'+esc(s.from||'—')+'</div><div>'+esc(s.to||'—')+'</div></div></div>';
  h+='<div class="tags">'+(s.type=='Round'?'<span class="pill">Round trip</span>':s.type=='Others'?'<span class="pill">Others</span>':'')+(s.cat?'<span class="pill">'+esc(s.cat)+'</span>':'')+'</div>';
  if(s.veh)h+='<div class="sub" style="margin-top:10px">Vehicle '+esc(s.veh)+(s.vname?' ('+esc(s.vname)+')':'')+'</div>';
  if(s.startAt)h+='<div class="sub" style="margin-top:4px">Started at '+hm(s.startAt)+(s.sKm!=null?' · meter '+fmtn(s.sKm)+' km':'')+'</div>';
  if(s.note)h+='<div class="sub" style="margin-top:6px">'+esc(s.note)+'</div>';
  if(s.status=='completed'||s.status=='posted')h+='<div class="rt sub">Bill '+esc(s.bill||'—')+(s.copy&&s.cbill?' · Copy '+esc(s.cbill):'')+(s.charge!=null?' · Charge '+fmt(s.charge)+' · Fuel '+fmt(s.fuel)+' · Salik '+fmt(s.salik):'')+((s.cat||'Company')=='Company'?' · Company outstanding':' · '+(s.paid?'Paid ('+esc(s.pm||'')+')':'Not paid'))+'</div>';
  if(!who){
    if(s.status=='posted'){}
    else if(s.status=='completed')h+='<button class="sm" data-a="done" data-id="'+s.id+'">Edit details</button>';
    else if(s.status=='started')h+='<button class="btn" data-a="done" data-id="'+s.id+'">Complete trip</button>';
    else if(s.date>TODAY)h+='<div class="sub" style="margin-top:10px">You can start this trip on '+fsh(s.date)+'.</div>';
    else h+='<button class="btn" data-a="start" data-id="'+s.id+'">Start trip</button>'+(Date.now()>=stt(s)?'<button class="sm" data-a="done" data-id="'+s.id+'">Already finished? Complete it</button>':'');
  }else if(isNew(s))h+='<button class="sm" data-a="edit" data-id="'+s.id+'">Edit</button><button class="sm d" data-a="del" data-id="'+s.id+'">Cancel trip</button>';

/* ---------- advance OTP approvals ---------- */
const AEXP=30*60*1000;
async function otpHash(otp,id,uid){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(otp),'PBKDF2',false,['deriveBits']),b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(id+'|'+uid),iterations:150000,hash:'SHA-256'},k,256);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function advSt(a){if(a.status=='pending'&&Date.now()-(a.at||0)>AEXP)return 'expired';if(a.status=='approved'&&Date.now()-(a.apAt||0)>AEXP)return 'expired';return a.status}
function advHtml(){
  const L=ADQ.filter(a=>['pending','approved','used'].indexOf(advSt(a))>=0).slice(0,60);if(!L.length)return '';
  const P=L.filter(a=>advSt(a)=='pending'),R=L.filter(a=>advSt(a)!='pending');let h='';
  const det=a=>'<div class="sub">For: '+esc(a.purpose||'Salary advance')+' · given on '+fdt(a.date)+'</div><div class="sub">Paid by: '+esc(a.mode||'')+' · requested by '+esc(a.byName||'the office')+'</div>'+(a.note?'<div class="sub">Note: '+esc(a.note)+'</div>':'');
  if(P.length)h+='<h2 style="margin-top:4px">Advance requests</h2>'+P.map(a=>'<div class="card"><div class="it"><div><b>Salary advance</b>'+det(a)+'</div><div class="r"><b>AED '+fmt(a.amt)+'</b></div></div><div class="note">Approve only if you are receiving this advance right now. Approving gives you a 6-digit PIN that you tell the accountant. If you did not ask for it, decline.</div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" style="flex:1;margin:0" data-a="aok" data-id="'+a.id+'">Approve and get PIN</button><button class="sm d" data-a="ano" data-id="'+a.id+'" style="margin:0">Decline</button></div></div>').join('');
  if(R.length)h+='<h2>Approved advances</h2>'+R.map(a=>{const st=advSt(a);let b='';
    if(st=='approved'){const o=OTPS[a.id]||(function(){try{return localStorage.getItem('otp_'+a.id)}catch(e){return null}})();b=o?'<div class="note">Tell this PIN to the accountant. It works once and expires 30 minutes after you approved.</div><div style="font:800 36px/1.2 monospace;letter-spacing:8px;text-align:center;margin:8px 0">'+esc(o)+'</div>':'<div class="note">Approved. The PIN was shown on the device where you approved.</div>'}
    const pl={approved:['w','Approved · waiting for accountant'],used:['g','Advance given'],declined:['','Declined'],cancelled:['','Cancelled by office'],expired:['','Expired']}[st]||['',esc(st)];
    return '<div class="card"><div class="it"><div><b>Salary advance</b>'+det(a)+'</div><div class="r"><b>AED '+fmt(a.amt)+'</b><div><span class="pill '+pl[0]+'">'+pl[1]+'</span></div></div></div>'+b+'</div>'}).join('');
  return h}
async function advApprove(id){
  const a=ADQ.find(x=>x.id==id);if(!a||advSt(a)!='pending')return;const btn=document.querySelector('[data-a="aok"][data-id="'+id+'"]');if(btn)btn.disabled=true;
  try{const otp=String(100000+(crypto.getRandomValues(new Uint32Array(1))[0]%900000)),h=await otpHash(otp,id,a.uid);
    OTPS[id]=otp;try{localStorage.setItem('otp_'+id,otp)}catch(e){}
    await db.collection('advreq').doc(id).update({status:'approved',otpH:h,apAt:Date.now()})}
  catch(e){delete OTPS[id];alert(e.code=='permission-denied'?'This request is no longer open.':'Could not approve. Check your connection.');if(btn)btn.disabled=false}}
async function advDecline(id){

function selHtml(ci){const sel=ci.filter(t=>DSEL.has(String(t.bill))),tot=Math.round(sel.reduce((q,t)=>q+(+t.pend||0),0)*100)/100,all=sel.length==ci.length&&ci.length>0;

function depSt(r){const t=r.status=='approved'?(r.apAt||0):(r.at||0);return (r.status=='pending'||r.status=='approved')&&Date.now()-t>AEXP?'expired':r.status}
function depHtml(ci,cs){

    if(st=='approved')return '<div class="card"><b>Enter the PIN</b><div class="sub" style="margin:2px 0 10px">The accountant received AED '+fmt(A.rcv)+billsTxt(A)+'. Enter the 6-digit PIN they give you to complete this deposit.</div><input class="pin" id="dep_in" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="······">'+(DF[A.id]?'<div class="err">Wrong PIN. '+(5-DF[A.id])+' tries left.</div>':'<div class="err" id="dep_er"></div>')+'<button class="btn" data-a="depok" data-id="'+A.id+'" style="margin-top:4px">Confirm deposit</button><button class="sm d" data-a="depx" data-id="'+A.id+'">Cancel</button></div>';
    return '<div class="card"><div class="it"><div><b>PIN verified</b><div class="sub">The office is updating your cash now.</div></div><span class="pill g">Done</span></div></div>'}
  const L=DEPQ[0],ln=L&&L.status=='posted'?'<div class="sub" style="margin:0 0 10px">Last deposit: AED '+fmt(L.rcv)+' recorded '+fdt(ymd(new Date(L.postAt||L.cfAt||L.at)))+'</div>':L&&L.status=='rejected'?'<div class="sub" style="margin:0 0 10px">Your last deposit request was rejected by the accountant.</div>':'';

function depStart(){if(DEPQ.some(r=>['pending','approved','confirmed'].indexOf(depSt(r))>=0))return;DSEL=new Set();paint()}
async function depReq(){const cs=(D&&D.cash)||{},ci=(cs.items||[]).filter(t=>(+t.pend||0)>0);if(DEPQ.some(r=>['pending','approved','confirmed'].indexOf(depSt(r))>=0))return alert('You already have a deposit request in progress. Cancel it or finish it first.');if(!DSEL){DSEL=new Set();paint();return alert('Tick the bills first, then press Submit request.')}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,id=b.dataset.id;
  if(a=='seg'){DV=v;paint()}
  else if(a=='mon'){CM=new Date(CM.getFullYear(),CM.getMonth()+(+v),1);paint()}
  else if(a=='day'){SEL=v;paint()}
  else if(a=='new')openForm();
  else if(a=='edit')openForm(id);
  else if(a=='del'){if(confirm('Cancel this scheduled trip?'))db.collection('schedule').doc(id).delete().catch(()=>alert('Could not cancel. The trip may already be started or completed.'))}
  else if(a=='cat'){FC=v;document.querySelectorAll('#f_cat button').forEach(x=>x.classList.toggle('on',x.dataset.v==v));$('#f_cow').classList.toggle('hide',v!='Company')}
  else if(a=='cpy'){DN.copy=v=='1';drawCopy()}
  else if(a=='ty'){FT=v;document.querySelectorAll('#f_ty button').forEach(x=>x.classList.toggle('on',x.dataset.v==v))}
  else if(a=='save')saveForm();
  else if(a=='start')openStart(id);
  else if(a=='ssave')saveStart();
  else if(a=='icard'){IV=v;paint();scrollTo(0,0)}
  else if(a=='iback'){IV='';paint();scrollTo(0,0)}
  else if(a=='cfil'){CF2=v;paint()}
  else if(a=='dep')depStart();
  else if(a=='depsel'){if(DSEL){b.checked?DSEL.add(String(v)):DSEL.delete(String(v));selPaint()}}
  else if(a=='depall'){if(DSEL){const ci=(((D&&D.cash)||{}).items||[]).filter(t=>(+t.pend||0)>0);if(b.checked)ci.forEach(t=>DSEL.add(String(t.bill)));else DSEL.clear();selPaint()}}
  else if(a=='depsub')depReq();
  else if(a=='depback'){DSEL=null;paint()}
  else if(a=='depok')depVerify(id);
  else if(a=='depx'){if(confirm('Cancel this deposit request?'))db.collection('depreq').doc(id).update({status:'cancelled',decAt:Date.now()}).catch(()=>alert('Could not cancel.'))}
  else if(a=='aok')advApprove(id);
  else if(a=='ano')advDecline(id);
  else if(a=='done')openDone(id);
  else if(a=='pay'){DN.paid=v=='true';if(!DN.paid)DN.pm='';drawPay()}

  else if(a=='dsave')saveDone();

async function login(){
  const u=$('#u').value.trim().toLowerCase().replace(/\s+/g,''),p=$('#p').value;$('#e').textContent='';
  if(!u||!p){$('#e').textContent='Enter your username and password.';return}
  $('#go').disabled=true;$('#go').textContent='Signing in…';
  try{await auth.signInWithEmailAndPassword(u+'@'+DOMAIN,p);$('#p').value=''}
  catch(e){const c=e.code||'';$('#e').textContent=/network/.test(c)?'No internet connection.':/too-many/.test(c)?'Too many attempts. Try again later.':'Wrong username or password.'}
  $('#go').disabled=false;$('#go').textContent='Sign in';
}
$('#go').onclick=login;$('#p').onkeydown=e=>{if(e.key=='Enter')login()};
$('#sh').onclick=()=>{const p=$('#p'),h=p.type=='password';p.type=h?'text':'password';$('#sh').textContent=h?'Hide':'Show'};
$('#out').onclick=()=>auth.signOut();
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;let dip=null;
function inst(html,cb){['#inst','#inst2'].forEach(s=>{const b=$(s);b.classList.remove('hide');b.innerHTML=html});if(cb)cb()}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;if(!standalone)inst('<b>Install this app</b><div class="sub">Add it to your home screen for quick access.</div><button class="btn" data-i style="margin-top:12px">Install</button>',()=>document.querySelectorAll('[data-i]').forEach(b=>b.onclick=async()=>{dip.prompt();await dip.userChoice;dip=null;['#inst','#inst2'].forEach(s=>$(s).classList.add('hide'))}))});
if(!standalone&&/iphone|ipad|ipod/i.test(navigator.userAgent))inst('<b>Install on iPhone</b><div class="sub">Tap the Share button in Safari, then “Add to Home Screen”.</div>');
