/* ---------- advance OTP approvals ---------- */
const AEXP=30*60*1000;
async function otpHash(otp,id,uid){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(otp),'PBKDF2',false,['deriveBits']),b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(id+'|'+uid),iterations:150000,hash:'SHA-256'},k,256);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function advSt(a){if(a.status=='pending'&&Date.now()-(a.at||0)>AEXP)return 'expired';if(a.status=='approved'&&Date.now()-(a.apAt||0)>AEXP)return 'expired';return a.status}
function advHtml(){
  const L=ADQ.filter(a=>['pending','approved','used'].indexOf(advSt(a))>=0).slice(0,60);if(!L.length)return '';
  const P=L.filter(a=>advSt(a)=='pending'),R=L.filter(a=>advSt(a)!='pending');let h='';
  const det=a=>'<div class="sub">For: '+esc(a.purpose||'Salary advance')+' · given on '+fdt(a.date)+'</div><div class="sub">Paid by: '+esc(a.mode||'')+' · requested by '+esc(a.byName||'the office')+'</div>'+(a.note?'<div class="sub">Note: '+esc(a.note)+'</div>':'');
  if(P.length)h+='<h2 style="margin-top:4px">Advance requests</h2>'+P.map(a=>'<div class="card"><div class="it"><div><b>Salary advance</b>'+det(a)+'</div><div class="r"><b>AED '+fmt(a.amt)+'</b></div></div><div class="note">Approve only if you are receiving this advance right now. Approving gives you a 6-digit PIN that you tell the accountant. If you did not ask for it, decline.</div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" style="flex:1;margin:0" data-a="aok" data-id="'+a.id+'">Approve and get PIN</button><button class="sm d" data-a="ano" data-id="'+a.id+'" style="margin:0">Decline</button></div></div>').join('');
  if(R.length)h+='<h2>Approved advances</h2>'+R.map(a=>{const st=advSt(a);let b='';
    if(st=='approved'){const o=OTPS[a.id]||(function(){try{return localStorage.getItem('otp_'+a.id)}catch(e){return null}})();b=o?'<div class="note">Tell this PIN to the accountant. It works once and expires 30 minutes after you approved.</div><div style="font:800 36px/1.2 monospace;letter-spacing:8px;text-align:center;margin:8px 0">'+esc(o)+'</div>':'<div class="note">Approved. The PIN was shown on the device where you approved.</div>'}
    const pl={approved:['w','Approved · waiting for accountant'],used:['g','Advance given'],declined:['','Declined'],cancelled:['','Cancelled by office'],expired:['','Expired']}[st]||['',esc(st)];
    return '<div class="card"><div class="it"><div><b>Salary advance</b>'+det(a)+'</div><div class="r"><b>AED '+fmt(a.amt)+'</b><div><span class="pill '+pl[0]+'">'+pl[1]+'</span></div></div></div>'+b+'</div>'}).join('');
  return h}
async function advApprove(id){
  const a=ADQ.find(x=>x.id==id);if(!a||advSt(a)!='pending')return;const btn=document.querySelector('[data-a="aok"][data-id="'+id+'"]');if(btn)btn.disabled=true;
  try{const otp=String(100000+(crypto.getRandomValues(new Uint32Array(1))[0]%900000)),h=await otpHash(otp,id,a.uid);
    OTPS[id]=otp;try{localStorage.setItem('otp_'+id,otp)}catch(e){}
    await db.collection('advreq').doc(id).update({status:'approved',otpH:h,apAt:Date.now()})}
  catch(e){delete OTPS[id];alert(e.code=='permission-denied'?'This request is no longer open.':'Could not approve. Check your connection.');if(btn)btn.disabled=false}}
async function advDecline(id){
  if(!confirm('Decline this advance? Nothing will be paid or recorded.'))return;

/* ---------- footer and cash deposit ---------- */
const FOOT=()=>'<div class="foot"><div class="lg"><img src="icon-192.png" alt=""></div>© '+new Date().getFullYear()+' Saif Navas Transportation LLC · All rights reserved<br>Driver App '+VER+'</div>';
document.querySelectorAll('[data-foot]').forEach(e=>e.innerHTML=FOOT());
function depSt(r){const t=r.status=='approved'?(r.apAt||0):(r.at||0);return (r.status=='pending'||r.status=='approved')&&Date.now()-t>AEXP?'expired':r.status}
function depHtml(ci,cs){
  const A=DEPQ.find(r=>['pending','approved','confirmed'].indexOf(depSt(r))>=0);
  if(A){const st=depSt(A);
    if(st=='pending')return '<div class="card"><div class="it"><div><b>Deposit request sent</b><div class="sub">Waiting for the accountant to approve · AED '+fmt(A.amt)+'</div></div><span class="pill w">Pending</span></div><button class="sm d" data-a="depx" data-id="'+A.id+'">Cancel request</button></div>';
    if(st=='approved')return '<div class="card"><b>Enter the PIN</b><div class="sub" style="margin:2px 0 10px">The accountant received AED '+fmt(A.rcv)+'. Enter the 6-digit PIN they give you to complete this deposit.</div><input class="pin" id="dep_in" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="······">'+(DF[A.id]?'<div class="err">Wrong PIN. '+(5-DF[A.id])+' tries left.</div>':'<div class="err" id="dep_er"></div>')+'<button class="btn" data-a="depok" data-id="'+A.id+'" style="margin-top:4px">Confirm deposit</button><button class="sm d" data-a="depx" data-id="'+A.id+'">Cancel</button></div>';
    return '<div class="card"><div class="it"><div><b>PIN verified</b><div class="sub">The office is updating your cash now.</div></div><span class="pill g">Done</span></div></div>'}
  const L=DEPQ[0],ln=L&&L.status=='posted'?'<div class="sub" style="margin:0 0 10px">Last deposit: AED '+fmt(L.rcv)+' recorded '+fdt(ymd(new Date(L.postAt||L.cfAt||L.at)))+'</div>':L&&L.status=='rejected'?'<div class="sub" style="margin:0 0 10px">Your last deposit request was rejected by the accountant.</div>':'';
  return (ci.length?'<button class="btn" data-a="dep" style="margin:0 0 12px">Deposit now</button>':'')+ln}
async function depReq(){const cs=(D&&D.cash)||{};if(!(cs.total>0)||DEPQ.some(r=>['pending','approved','confirmed'].indexOf(depSt(r))>=0))return;
  if(!confirm('Send a deposit request for AED '+fmt(cs.total)+' to the accountant?'))return;
  try{const now=Date.now();await db.collection('depreq').add({uid:U.uid,driver:(D&&D.name)||ME.name||'',amt:Math.round(cs.total*100)/100,bills:(cs.items||[]).slice(0,60).map(t=>t.bill),status:'pending',at:now,_ts:now})}
  catch(e){alert(e.code=='permission-denied'?'Not allowed yet. The office must publish the latest Firestore rules.':'Could not send. Check your connection.')}}
async function depVerify(id){const r=DEPQ.find(x=>x.id==id),v=($('#dep_in')||{}).value||'',er=$('#dep_er');if(!r||depSt(r)!='approved')return;
  if(!/^\d{6}$/.test(v)){if(er)er.textContent='Enter the 6-digit PIN.';return}
  const b=document.querySelector('[data-a="depok"]');if(b)b.disabled=true;
  try{const h=await otpHash(v,id,r.uid);
    if(h!==r.otpH){const n=DF[id]=(DF[id]||0)+1;if(n>=5){await db.collection('depreq').doc(id).update({status:'cancelled',decAt:Date.now()});alert('Too many wrong PINs. The request was cancelled. Send a new one.')}paint();return}
    await db.collection('depreq').doc(id).update({status:'confirmed',cfAt:Date.now()})}
  catch(e){if(er)er.textContent='Could not complete. Check your connection.';if(b)b.disabled=false}}
