<script>
const FB={apiKey:"AIzaSyDjIdRU9ZheXDQYmE-8onjE3Vow_cX7t44",authDomain:"saifnavastransportation.firebaseapp.com",projectId:"saifnavastransportation",storageBucket:"saifnavastransportation.firebasestorage.app",messagingSenderId:"858865289383",appId:"1:858865289383:web:750474764d16a68ec7f382"};

const auth=firebase.auth(),db=firebase.firestore(),$=s=>document.querySelector(s);try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- cards ---------- */

  const st=stat(s);
  let h='<div class="card"><div class="it"><div><b>'+esc(s.customer||'Trip')+'</b>'+(s.company?'<div class="sub">'+esc(s.company)+'</div>':'')+'<div class="sub">'+fdt(s.date)+(s.time?' · '+esc(s.time):'')+(who?' · '+esc(s.driver||''):'')+'</div></div><div class="r"><span class="pill '+st.c+'">'+esc(st.t)+'</span></div></div>';

/* ---------- advance OTP approvals ---------- */
const AEXP=30*60*1000;
async function otpHash(otp,id,uid){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(otp),'PBKDF2',false,['deriveBits']),b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(id+'|'+uid),iterations:150000,hash:'SHA-256'},k,256);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

function advHtml(){
  const L=ADQ.filter(a=>Date.now()-(a.at||0)<7*864e5);if(!L.length)return '';
  const P=L.filter(a=>advSt(a)=='pending'),R=L.filter(a=>advSt(a)!='pending');let h='';
  const det=a=>'<div class="sub">For: '+esc(a.purpose||'Salary advance')+' · given on '+fdt(a.date)+'</div><div class="sub">Paid by: '+esc(a.mode||'')+' · requested by '+esc(a.byName||'the office')+'</div>'+(a.note?'<div class="sub">Note: '+esc(a.note)+'</div>':'');
  if(P.length)h+='<h2 style="margin-top:4px">Advance requests</h2>'+P.map(a=>'<div class="card"><div class="it"><div><b>Salary advance</b>'+det(a)+'</div><div class="r"><b>AED '+fmt(a.amt)+'</b></div></div><div class="note">Approve only if you are receiving this advance right now. Approving gives you a 6-digit PIN that you tell the accountant. If you did not ask for it, decline.</div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" style="flex:1;margin:0" data-a="aok" data-id="'+a.id+'">Approve and get PIN</button><button class="sm d" data-a="ano" data-id="'+a.id+'">Decline</button></div></div>').join('');
  if(R.length)h+='<h2>Recent advances</h2>'+R.map(a=>{const st=advSt(a);let b='';
    if(st=='approved'){const o=OTPS[a.id]||(function(){try{return localStorage.getItem('otp_'+a.id)}catch(e){return null}})();b=o?'<div class="note">Tell this PIN to the accountant. It works once and expires 30 minutes after you approved.</div><div style="font:700 34px/1.2 monospace;letter-spacing:8px;text-align:center;margin:8px 0">'+esc(o)+'</div>':'<div class="note">Approved. The PIN was shown on the device where you approved.</div>'}
    const pl={approved:['w','Approved · waiting for accountant'],used:['g','Advance given'],declined:['','Declined'],cancelled:['','Cancelled by office'],expired:['','Expired']}[st]||['',esc(st)];
    return '<div class="card"><div class="it"><div><b>Salary advance</b>'+det(a)+'</div><div class="r"><b>AED '+fmt(a.amt)+'</b><div><span class="pill '+pl[0]+'">'+pl[1]+'</span></div></div></div>'+b+'</div>'}).join('');
  return h}
async function advApprove(id){
  const a=ADQ.find(x=>x.id==id);if(!a||advSt(a)!='pending')return;const btn=document.querySelector('[data-a="aok"][data-id="'+id+'"]');if(btn)btn.disabled=true;
  try{const otp=String(100000+(crypto.getRandomValues(new Uint32Array(1))[0]%900000)),h=await otpHash(otp,id,a.uid);
    OTPS[id]=otp;try{localStorage.setItem('otp_'+id,otp)}catch(e){}
    await db.collection('advreq').doc(id).update({status:'approved',otpH:h,apAt:Date.now()})}
  catch(e){delete OTPS[id];alert(e.code=='permission-denied'?'This request is no longer open.':'Could not approve. Check your connection.');if(btn)btn.disabled=false}}
async function advDecline(id){
